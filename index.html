<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#07070c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PACHINKUBE</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      /* Type: Orbitron for the arcade "display" voice — title, round, combo,
         big scores, pocket multipliers. Space Grotesk for everything you read —
         HUD rows, charm cards, shop, leaderboard. Mono stays for seed/hash. */
      :root { --display: "Orbitron", "Space Grotesk", sans-serif; --text: "Space Grotesk", system-ui, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
      :root { color-scheme: dark; --magenta: #ff2d95; --cyan: #2de2ff; --gold: #ffd34d; --bg: #07070c; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
      body { font: 14px/1.45 var(--text); color: #c8d0d8; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; position: fixed; inset: 0; }
      code, .mono { font-family: var(--mono); font-size: 12px; }
      .display, #hud .title, #combo .n, #combo .l, .panel h2, .panel .score, #labels .pocket { font-family: var(--display); }
      #game { display: block; width: 100vw; height: 100vh; height: 100dvh; cursor: crosshair; touch-action: none; }
      #ui > * { position: fixed; }
      #left { top: 12px; left: 12px; width: min(340px, 30vw); min-width: 230px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
      #hud { position: static; padding: 10px 14px; background: rgba(10,10,20,.78); border: 1px solid #2a2440; border-radius: 6px; }
      #flight { position: static; padding: 8px 12px; background: rgba(10,10,20,.78); border: 1px solid #2a2440; border-radius: 6px; font-variant-numeric: tabular-nums; }
      #flight[hidden] { display: none; }
      #flight .fh { display: flex; justify-content: space-between; font-family: var(--display); font-size: 10px; letter-spacing: .22em; color: #6b7783; margin-bottom: 4px; }
      #flight .fb { display: grid; grid-template-columns: 10px 1fr auto 12px auto minmax(64px, auto); align-items: center; gap: 0 6px; padding: 2px 4px; border-radius: 4px; font-size: 13px; }
      #flight .fb i { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
      #flight .fb .nm { color: #c8d0d8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #flight .fb .ch { color: #fff; text-align: right; } #flight .fb .op { color: #6b7783; text-align: center; } #flight .fb .mu { color: var(--gold); text-align: right; }
      #flight .fb .eq { color: var(--cyan); text-align: right; font-family: var(--display); font-size: 12px; font-weight: 700; }
      #flight .fb.rainbow .nm { background: linear-gradient(90deg, #ff2d95, #ffd34d, #2de2ff, #b46cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #flight .fb.more { color: #6b7783; grid-template-columns: 1fr; font-size: 11px; }
      #hud .title { color: var(--magenta); letter-spacing: .18em; font-weight: 900; font-size: 13px; margin-bottom: 4px; }
      #hud .row { display: flex; justify-content: space-between; gap: 8px; }
      #hud .big { font-size: 17px; color: #fff; font-weight: 700; letter-spacing: .02em; }
      #hud .cleared { color: var(--gold); font-family: var(--text); font-weight: 500; }
      #hud small { color: #6b7783; font-size: 11px; }
      #hud .dim { color: #6b7783; }
      #hud code { color: var(--cyan); }
      #hud .bag { flex-wrap: wrap; justify-content: flex-start; gap: 2px 10px; }
      #hud .bar { height: 5px; margin: 6px 0; background: #1a1d2a; border-radius: 3px; overflow: hidden; }
      #hud .bar div { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--magenta)); transition: width .2s; }
      #charms { top: 12px; right: 12px; width: min(220px, 18vw); display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
      .charm { padding: 5px 9px; border-radius: 4px; background: rgba(10,10,20,.78); border-left: 3px solid #556; display: flex; align-items: center; gap: 8px; }
      .charm span:first-of-type { flex: 1; }
      svg.px { width: 24px; height: 24px; image-rendering: pixelated; flex: none; filter: drop-shadow(0 0 4px rgba(255,255,255,.15)); }
      .charm svg.px { width: 18px; height: 18px; }
      .ic { display: flex; align-items: center; margin: 4px 0 6px; } .ic svg.px { width: 36px; height: 36px; }
      .ic.dim svg.px { opacity: .35; }
      .toast { display: flex; gap: 10px; align-items: center; } .toast .ic { margin: 0; } .toast .ic svg.px { width: 28px; height: 28px; }
      .card .ic svg.px { width: 32px; height: 32px; } .card.locked .ic svg.px { filter: none; }
      .offer .ic svg.px { width: 40px; height: 40px; filter: drop-shadow(0 0 8px rgba(255,255,255,.25)); }
      .charm.uncommon { border-left-color: var(--cyan); } .charm.rare { border-left-color: var(--gold); }
      .charm.temp { border-left-style: dashed; display: flex; justify-content: space-between; gap: 8px; }
      .charm .left { color: #9aa4b0; font-size: 11px; white-space: nowrap; }
      .el-fire { background: linear-gradient(90deg, rgba(255,106,0,.18), rgba(10,10,20,.78)); }
      .el-ice { background: linear-gradient(90deg, rgba(159,232,255,.18), rgba(10,10,20,.78)); }
      .el-storm { background: linear-gradient(90deg, rgba(125,249,255,.18), rgba(10,10,20,.78)); }
      .offer .dur { margin-left: 8px; color: var(--gold); font-family: var(--text); text-transform: none; letter-spacing: 0; }
      .offer .lvl { margin-left: 8px; color: var(--magenta); }
      .offer.upgrade { border-color: rgba(255,45,149,.55); }
      .offer .tag.new { color: #000; background: var(--cyan); padding: 1px 6px; border-radius: 3px; margin-left: 8px; }
      .offer.fresh { border-color: var(--cyan); box-shadow: 0 0 18px rgba(45,226,255,.28); animation: freshPulse 1.6s ease-in-out infinite alternate; }
      @keyframes freshPulse { to { box-shadow: 0 0 30px rgba(45,226,255,.55); } }
      .offer.el-fire { border-color: rgba(255,106,0,.5); } .offer.el-ice { border-color: rgba(159,232,255,.5); } .offer.el-storm { border-color: rgba(125,249,255,.5); }
      #labels .pocket { position: fixed; transform: translate(-50%, 0); color: var(--cyan); font-size: 11px; font-weight: 700; pointer-events: none; text-shadow: 0 0 8px rgba(45,226,255,.6); }
      #labels .pocket.jackpot { color: var(--magenta); font-weight: 700; text-shadow: 0 0 10px rgba(255,45,149,.8); }
      #labels .pocket.lottery { color: var(--gold); text-shadow: 0 0 12px rgba(255,211,77,.9); }
      #labels .pocket.lottery::after { content: " ★"; }
      #labels .pocket.bump { animation: pocketBump .35s cubic-bezier(.2,1.6,.4,1); }
      @keyframes pocketBump { 0% { transform: translate(-50%, 0) scale(1.6); } 100% { transform: translate(-50%, 0) scale(1); } }
      .popup { position: fixed; left: 0; top: 0; pointer-events: none; font-weight: 700; white-space: nowrap; will-change: transform, opacity; font-family: var(--display); }
      .popup.info { font-family: var(--text); }
      .popup.chips { color: #fff; font-size: 13px; }
      .popup.mult { color: var(--gold); font-size: 15px; text-shadow: 0 0 10px rgba(255,211,77,.8); }
      .popup.score { color: var(--magenta); font-size: 20px; text-shadow: 0 0 14px rgba(255,45,149,.9); }
      .popup.info { color: var(--cyan); }
      #hint { bottom: 12px; left: 12px; color: #5a6470; pointer-events: none; }
      #combo { top: 6vh; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; animation: comboPop .28s cubic-bezier(.2,1.6,.4,1) both; }
      #combo[hidden] { display: none; }
      #combo .n { font-size: 64px; font-weight: 900; line-height: 1; color: #fff; text-shadow: 0 0 18px rgba(255,255,255,.55); }
      #combo .l { font-size: 11px; font-weight: 700; letter-spacing: .4em; color: #9aa4b0; margin-top: 4px; }
      #combo.t1 .n { color: var(--cyan); text-shadow: 0 0 22px rgba(45,226,255,.9); }
      #combo.t2 .n { color: var(--gold); text-shadow: 0 0 26px rgba(255,211,77,.95); font-size: 76px; }
      #combo.t3 .n { color: var(--magenta); text-shadow: 0 0 32px rgba(255,45,149,1), 0 0 60px rgba(255,45,149,.6); font-size: 92px; }
      #combo.hit .n { animation: comboHit .35s ease-out both; }
      #combo.out { animation: comboOut .7s ease-in both; }
      @keyframes comboPop { from { transform: translateX(-50%) scale(1.35); } to { transform: translateX(-50%) scale(1); } }
      @keyframes comboHit { 0% { filter: brightness(3); letter-spacing: .12em; } 100% { filter: brightness(1); letter-spacing: 0; } }
      @keyframes comboOut { to { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(1.15); } }
      .banner { left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 900; font-size: clamp(28px, 6vw, 72px); letter-spacing: .12em; color: #fff; text-shadow: 0 0 24px rgba(255,255,255,.7), 0 0 60px rgba(255,45,149,.8); pointer-events: none; z-index: 2; animation: bannerIn 1.4s cubic-bezier(.2,1.4,.3,1) both; white-space: nowrap; }
      @keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.2); letter-spacing: .6em; } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1); letter-spacing: .12em; } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1.05); } }
      #flash { inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen; z-index: 1; }
      #hud, #charms, #combo, #toasts, #dock, #hint, #labels { z-index: 2; }
      #modal, #collection, #board-panel { z-index: 3; }
      #modal { inset: 0; display: grid; place-items: center; background: rgba(4,4,10,.72); backdrop-filter: blur(3px); }
      #modal[hidden] { display: none; }
      .panel { width: min(920px, 92vw); padding: 24px 28px; background: #0d0d18; border: 1px solid #2a2440; border-radius: 10px; box-shadow: 0 0 60px rgba(255,45,149,.15); }
      .panel h2 { color: #fff; letter-spacing: .1em; font-weight: 700; font-size: 18px; margin-bottom: 4px; }
      .panel .score { font-size: 40px; font-weight: 900; color: var(--magenta); text-shadow: 0 0 20px rgba(255,45,149,.7); margin: 6px 0; }
      .panel .dim { color: #6b7783; margin-bottom: 14px; }
      /* End of run: everything centred, big type, one obvious button. */
      .panel.end { width: min(720px, 94vw); max-height: 94vh; overflow: auto; padding: 30px 32px 26px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; border-color: rgba(255,45,149,.55); box-shadow: 0 0 80px rgba(255,45,149,.22), inset 0 0 60px rgba(255,45,149,.04); animation: panelIn .5s cubic-bezier(.2,1.4,.3,1) both; }
      .panel.end.gold { border-color: rgba(255,211,77,.6); box-shadow: 0 0 80px rgba(255,211,77,.22), inset 0 0 60px rgba(255,211,77,.04); }
      @keyframes panelIn { from { opacity: 0; transform: scale(.85) translateY(20px); } }
      .panel.end .verdict { font-family: var(--display); font-weight: 900; font-size: clamp(20px, 3.4vw, 30px); letter-spacing: .26em; color: #fff; text-shadow: 0 0 18px rgba(255,255,255,.5), 0 0 40px rgba(255,45,149,.7); }
      .panel.end.gold .verdict { text-shadow: 0 0 18px rgba(255,255,255,.5), 0 0 40px rgba(255,211,77,.8); }
      .panel.end .score { font-size: clamp(46px, 8vw, 76px); line-height: 1.05; margin: 2px 0 0; animation: scoreGlow 1.8s ease-in-out infinite alternate; }
      @keyframes scoreGlow { from { text-shadow: 0 0 20px rgba(255,45,149,.7); } to { text-shadow: 0 0 34px rgba(255,45,149,1), 0 0 70px rgba(255,45,149,.5); } }
      .panel.end .sub { color: #9aa4b0; font-size: 15px; margin: 2px 0 8px; }
      .panel.end .stats { display: flex; gap: 26px; justify-content: center; flex-wrap: wrap; margin: 4px 0 10px; }
      .panel.end .stats b { display: block; font-family: var(--display); font-size: 24px; color: var(--cyan); text-shadow: 0 0 12px rgba(45,226,255,.5); }
      .panel.end .stats small { display: block; color: #6b7783; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; margin-top: 2px; }
      .panel.end form#submit { width: min(440px, 100%); justify-content: center; margin: 6px 0 2px; }
      .panel.end form#submit input { font-size: 15px; text-align: center; }
      .panel.end form#submit button { font-family: var(--display); letter-spacing: .1em; font-size: 12px; border-color: var(--cyan); color: var(--cyan); }
      .panel.end #submit-msg { min-height: 1.4em; margin: 4px 0; font-size: 15px; } .panel.end #submit-msg.auto b { color: var(--cyan); }
      .panel.end .discord-cta { margin: 4px 0 6px; text-align: left; }
      .panel.end #run-discoveries { width: 100%; }
      .panel.end #run-discoveries h3, .panel.end #board h3 { font-family: var(--display); font-size: 11px; letter-spacing: .26em; color: #6b7783; margin: 12px 0 6px; }
      .panel.end #board h3 small { font-family: var(--text); letter-spacing: 0; text-transform: lowercase; }
      .panel.end #run-discoveries ul { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; margin: 0; }
      .panel.end #run-discoveries li { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px; background: #12121f; border: 1px solid #2a2440; border-radius: 6px; font-size: 13px; text-align: left; }
      .panel.end #run-discoveries li svg.px { width: 22px; height: 22px; }
      .panel.end #run-discoveries li .tag { display: block; font-size: 9px; }
      .panel.end #run-discoveries li.unlock { border-color: rgba(255,45,149,.45); } .panel.end #run-discoveries li.feat { border-color: rgba(255,211,77,.45); }
      .panel.end #board { width: min(460px, 100%); }
      .panel.end #board ol { list-style: none; margin: 0; padding: 0; }
      .panel.end #board li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; max-width: none; padding: 6px 10px; border-bottom: 1px solid #1a1d2a; font-size: 15px; color: #c8d0d8; text-align: left; }
      .panel.end #board li .rank { font-family: var(--display); color: #6b7783; font-size: 12px; } .panel.end #board li .pts { font-family: var(--display); font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
      .panel.end #board li.first .rank, .panel.end #board li.first .pts { color: var(--gold); }
      .panel.end #board li.me { background: rgba(45,226,255,.08); border-radius: 6px; border-bottom-color: transparent; } .panel.end #board li.me .who { color: var(--cyan); }
      .panel.end button.primary.big { font-family: var(--display); font-size: 16px; letter-spacing: .18em; padding: 14px 40px; margin-top: 18px; border-radius: 8px; box-shadow: 0 0 26px rgba(255,45,149,.55); animation: pulseBtn 1.6s ease-in-out infinite alternate; }
      .panel.end button.primary.big:hover { transform: translateY(-1px); box-shadow: 0 0 40px rgba(255,45,149,.9); }
      @keyframes pulseBtn { to { box-shadow: 0 0 44px rgba(255,45,149,.9); } }
      .panel.end .keys { color: #5a6470; font-size: 11px; margin-top: 6px; letter-spacing: .06em; }
      .offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
      .offer { text-align: left; padding: 14px; background: #12121f; border: 1px solid #2a2440; border-radius: 8px; color: inherit; font: inherit; cursor: pointer; transition: transform .1s, border-color .1s; }
      .offer:hover { transform: translateY(-2px); border-color: var(--cyan); }
      .offer .tag { display: inline-block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #6b7783; margin-bottom: 6px; font-family: var(--display); }
      .offer.uncommon .tag { color: var(--cyan); } .offer.rare .tag { color: var(--gold); } .offer.ball .tag { color: var(--magenta); }
      .offer b { display: block; color: #fff; margin-bottom: 6px; }
      .offer p { color: #9aa4b0; }
      form#submit { display: flex; gap: 8px; margin: 8px 0; }
      input { flex: 1; padding: 8px 10px; background: #12121f; border: 1px solid #2a2440; border-radius: 6px; color: #fff; font: inherit; }
      button { padding: 8px 14px; background: #1a1a2c; border: 1px solid #2a2440; border-radius: 6px; color: #fff; font: inherit; cursor: pointer; }
      button.primary { background: var(--magenta); border-color: var(--magenta); color: #000; font-weight: 700; margin-top: 12px; }
      button.danger { color: #ff7b7b; border-color: rgba(255,123,123,.4); font-size: 12px; } button.danger:hover { background: rgba(255,123,123,.12); }
      #board i.ok { color: var(--cyan); font-style: normal; } #board i.dc { color: var(--magenta); font-style: normal; }
      form#submit .who { flex: 1; align-self: center; color: #9aa4b0; } form#submit .who b { color: var(--cyan); }
      #toasts { right: 12px; bottom: 44px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; width: 260px; }
      .toast { padding: 8px 12px; background: rgba(10,10,20,.9); border: 1px solid #2a2440; border-left: 3px solid var(--cyan); border-radius: 6px; animation: toastIn .25s ease-out both; }
      .toast.unlock { border-left-color: var(--magenta); } .toast.feat { border-left-color: var(--gold); }
      .toast .head { display: block; font-size: 10px; letter-spacing: .24em; color: #6b7783; font-family: var(--display); }
      .toast b { display: block; color: #fff; } .toast small { color: #9aa4b0; }
      .toast.out { animation: toastOut .6s ease-in both; }
      @keyframes toastIn { from { opacity: 0; transform: translateX(24px); } } @keyframes toastOut { to { opacity: 0; transform: translateX(24px); } }
      #dock { right: 12px; bottom: 12px; display: flex; gap: 6px; align-items: center; }
      #dock button { font-size: 12px; padding: 5px 10px; background: rgba(10,10,20,.78); }
      #dock button.on { border-color: var(--magenta); color: var(--magenta); }
      #stations { display: inline-flex; border: 1px solid #2a2440; border-radius: 6px; overflow: hidden; }
      #stations button { border: 0; border-radius: 0; padding: 5px 9px; }
      #stations button + button { border-left: 1px solid #2a2440; }
      #stations button.on { background: var(--magenta); color: #000; }
      #dock .btn { font-size: 12px; padding: 5px 10px; background: rgba(10,10,20,.78); border: 1px solid #2a2440; border-radius: 6px; color: #fff; text-decoration: none; }
      #dock .who { color: var(--cyan); font-size: 12px; margin: 0 4px 0 8px; }
      #dock input[type=range] { width: 70px; accent-color: var(--magenta); display: none; }
      #dock.music-on input[type=range] { display: inline-block; }
      #board-panel { inset: 0; display: grid; place-items: center; background: rgba(4,4,10,.72); backdrop-filter: blur(3px); }
      #board-panel[hidden] { display: none; }
      #collection { inset: 0; display: grid; place-items: start center; overflow: auto; padding: 4vh 0; background: rgba(4,4,10,.82); backdrop-filter: blur(3px); }
      #collection[hidden] { display: none; }
      .panel.wide { width: min(1100px, 94vw); }
      .panel .row { display: flex; justify-content: space-between; align-items: center; }
      .panel h3 { color: #fff; margin: 16px 0 8px; letter-spacing: .08em; font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
      .card { padding: 10px 12px; background: #12121f; border: 1px solid #2a2440; border-radius: 8px; }
      .card b { display: block; color: #fff; margin: 4px 0; } .card p { color: #9aa4b0; font-size: 12px; }
      .card .tag { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #6b7783; }
      .card .tag.uncommon { color: var(--cyan); } .card .tag.rare { color: var(--gold); } .card .tag.ball { color: var(--magenta); }
      .card.locked { opacity: .55; border-style: dashed; } .card.fresh { border-color: var(--cyan); }
      .card .tag.new { color: var(--cyan); margin-left: 6px; }
      .card.feat { border-left: 3px solid var(--gold); } .card.feat.locked { border-left-color: #2a2440; }
      .card .prog { height: 4px; background: #1a1d2a; border-radius: 2px; margin-top: 6px; overflow: hidden; }
      .card .prog div { height: 100%; background: var(--cyan); }
      .card small { color: #6b7783; font-size: 11px; }
      #run-discoveries ul { list-style: none; margin: 4px 0 10px; } #run-discoveries li { color: #c8d0d8; }
      #run-discoveries .tag { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); }
      #run-discoveries .tag.unlock { color: var(--magenta); } #run-discoveries .tag.feat { color: var(--gold); }
      .discord-cta { display: flex; align-items: center; gap: 12px; margin: 12px 0 4px; padding: 10px 14px; background: #5865f2; color: #fff; text-decoration: none; border-radius: 8px; box-shadow: 0 6px 24px rgba(88,101,242,.35); transition: transform .12s, box-shadow .12s; }
      .discord-cta:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(88,101,242,.5); }
      .discord-cta b { display: block; font-family: var(--display); letter-spacing: .04em; font-size: 13px; }
      .discord-cta small { color: rgba(255,255,255,.82); }
      .discord-cta .dc-logo { font-size: 22px; line-height: 1; }
      .discord-cta.compact { margin: 0; padding: 8px 12px; }
      #signin-callout { right: 12px; bottom: 52px; display: flex; align-items: center; gap: 6px; z-index: 2; animation: toastIn .4s ease-out both; }
      #signin-callout .x { background: rgba(10,10,20,.78); padding: 6px 9px; }
      #submit-msg.auto { color: #9aa4b0; margin: 8px 0; } #submit-msg.auto.ok { color: var(--cyan); }
      #board ol { margin: 6px 0 0 18px; } #board li { display: flex; justify-content: space-between; max-width: 360px; } #board h3 { color: #fff; margin-top: 8px; }

      /* ---- Phones and small tablets: bars above and below, board in between.
         main.ts measures the bars, sets --hud-bottom / --dock-h and refits the camera. */
      @media (max-width: 760px) and (orientation: portrait) {
        :root { --hud-bottom: 96px; --dock-h: 44px; }
        #left { top: env(safe-area-inset-top, 0px); left: 0; right: 0; width: auto; min-width: 0; gap: 0; }
        #hud { border-radius: 0; border-width: 0 0 1px; padding: 6px 10px; font-size: 12px; background: rgba(10,10,20,.9); }
        #hud .title, #hud .bag, #hud .row:last-child { display: none; }
        #hud .big { font-size: 15px; } #hud .bar { margin: 4px 0; }
        #flight { border-radius: 0; border-width: 0 0 1px; padding: 3px 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-height: 26px; align-items: center; background: rgba(10,10,20,.9); }
        #flight::-webkit-scrollbar { display: none; }
        #flight[hidden] { display: flex; } /* fixed height: the camera must not jump when balls land */
        #flight .fh { display: none; }
        #flight .fb { display: inline-flex; grid-template-columns: none; gap: 4px; padding: 1px 6px; border: 1px solid #2a2440; border-radius: 10px; font-size: 11px; white-space: nowrap; flex: none; }
        #flight .fb .nm { display: none; } #flight .fb .eq { font-size: 11px; }
        #flight .fb.more { border: 0; }
        #charms { top: calc(var(--hud-bottom) + 4px); left: 0; right: 0; width: auto; flex-direction: row; gap: 4px; padding: 0 6px; overflow-x: auto; scrollbar-width: none; pointer-events: auto; }
        #charms::-webkit-scrollbar { display: none; }
        .charm { padding: 3px 6px; flex: none; border-left-width: 2px; } .charm span:first-of-type { display: none; } .charm .left { font-size: 10px; }
        /* Combo on the right, toasts on the left: they never fight for the centre. */
        #combo { top: calc(var(--hud-bottom) + 40px); left: auto; right: 12px; transform: none; text-align: right; }
        #combo .n { font-size: 44px; } #combo.t2 .n { font-size: 52px; } #combo.t3 .n { font-size: 60px; }
        @keyframes comboPop { from { transform: scale(1.35); transform-origin: right top; } to { transform: scale(1); } }
        @keyframes comboOut { to { opacity: 0; transform: translateY(-30px) scale(1.15); } }
        .banner { font-size: clamp(22px, 9vw, 40px); letter-spacing: .08em; white-space: normal; text-align: center; width: 90vw; }
        #dock { left: 0; right: 0; bottom: 0; justify-content: space-between; gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: rgba(10,10,20,.92); border-top: 1px solid #2a2440; }
        #dock button, #dock .btn { font-size: 12px; padding: 7px 9px; }
        #dock .who { display: none; }
        #dock input[type=range] { width: 54px; }
        #hint { display: none; }
        /* Toasts: top-right under the charm strip, compact, never over the pockets. */
        #toasts { left: 6px; right: auto; width: 56vw; top: calc(var(--hud-bottom) + 40px); bottom: auto; }
        .toast { padding: 5px 8px; font-size: 12px; gap: 6px; } .toast .ic svg.px { width: 20px; height: 20px; }
        .toast small { display: none; } .toast .head { font-size: 9px; }
        .toast:nth-last-child(n+3) { display: none; } /* two at a time on a phone */
        #stations { display: none; } #dock.music-on #stations { display: inline-flex; }
        #signin-callout { left: 8px; right: 8px; bottom: calc(var(--dock-h) + 8px); }
        #signin-callout .discord-cta { flex: 1; }
        .popup.chips { font-size: 11px; } .popup.mult { font-size: 13px; } .popup.score { font-size: 17px; }
        #labels .pocket { font-size: 10px; }
        /* Overlays: full width, scroll inside, big enough to tap. */
        #modal, #board-panel, #collection { place-items: start center; overflow: auto; padding: calc(8px + env(safe-area-inset-top, 0px)) 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
        .panel, .panel.wide, .panel.end { width: 100%; padding: 16px 14px; max-height: none; }
        .panel .score { font-size: 32px; }
        .panel.end { padding: 22px 14px 18px; } .panel.end .score { font-size: clamp(40px, 13vw, 56px); } .panel.end .stats { gap: 14px; }
        .panel.end .stats b { font-size: 20px; }
        .offers { grid-template-columns: 1fr; gap: 8px; }
        .offer { padding: 10px 12px; display: grid; grid-template-columns: 44px 1fr; column-gap: 10px; align-items: center; }
        .offer .tag { grid-column: 1 / -1; margin-bottom: 2px; } .offer .ic { grid-row: 2 / 4; margin: 0; } .offer b { margin: 0; } .offer p { font-size: 12px; }
        .offer .ic svg.px { width: 40px; height: 40px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; } .card { padding: 8px 10px; }
        input { font-size: 16px; } /* iOS zooms into anything smaller */
        button { padding: 10px 14px; }
        form#submit { flex-wrap: wrap; } form#submit input { min-width: 0; flex: 1 1 160px; }
        .discord-cta { padding: 10px 12px; } .discord-cta small { font-size: 11px; }
        #reset-box .confirm { flex-wrap: wrap; }
      }
      @media (max-height: 460px) and (orientation: landscape) {
        /* Landscape phone: the desktop side columns apply; trim what does not fit. */
        #hud .bag, #hud .row:last-child, #hint { display: none; } #hud { padding: 6px 10px; font-size: 12px; }
        #flight { display: none !important; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
